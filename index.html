<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nákupný jedálniček</title>
<meta name="theme-color" content="#E4572E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jedálniček">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EF; --card:#FFFFFF; --ink:#2A211B; --muted:#7D6F64; --line:#EDE3D7;
  --pri:#E4572E; --pri2:#F28C28; --pri-soft:#FDE9E1; --ok:#2F9E6B; --ok-soft:#E3F4EC;
  --warn:#C9821A; --warn-soft:#FCF1DE; --bad:#C0392B; --bad-soft:#FBE4E1;
  --r:18px; --shadow:0 2px 0 rgba(42,33,27,.04), 0 8px 24px rgba(42,33,27,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque";font-weight:800;font-size:20px;cursor:pointer}
.logo span.b{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;font-size:19px}
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:600;background:var(--pri);color:#fff;box-shadow:0 4px 14px rgba(228,87,46,.28);transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.btn.small{padding:8px 13px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
/* hero */
.hero{padding:34px 24px;border-radius:26px;background:linear-gradient(140deg,#FFE3D3 0%,#FFF3E0 55%,#EAF6EE 100%);position:relative;overflow:hidden}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:800;line-height:1.05;max-width:520px}
.hero p{font-size:17px;max-width:500px;color:#5A4B40}
.hero .float{position:absolute;font-size:44px;opacity:.9;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}
.feat{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.feat b{display:block;margin:6px 0 2px}
.feat .e{font-size:26px}
/* progress */
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 22px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:99px;transition:width .35s}
.section-tag{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;background:var(--pri-soft);color:var(--pri);padding:5px 11px;border-radius:99px;margin-bottom:10px}
.qtitle{font-size:clamp(24px,4.6vw,32px);font-weight:700;line-height:1.15;margin-bottom:6px}
.qsub{color:var(--muted);margin-bottom:20px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 12px;text-align:center;position:relative;transition:all .15s;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.opt:hover{border-color:#F4B79F;transform:translateY(-2px)}
.opt .e{font-size:38px;line-height:1}
.opt .l{font-weight:600}
.opt .d{font-size:13px;color:var(--muted);line-height:1.3}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel::after{content:"✓";position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px;display:grid;place-items:center;font-weight:700}
.opt.no.sel{border-color:var(--bad);background:var(--bad-soft)}
.opt.no.sel::after{content:"✕";background:var(--bad)}
.navq{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px}
/* setup */
.field{margin-bottom:22px}
.field>label{display:block;font-weight:600;margin-bottom:8px}
.big-num{display:flex;align-items:center;gap:12px}
.big-num .v{font-family:"Bricolage Grotesque";font-size:40px;font-weight:800;min-width:120px;text-align:center}
.step{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:22px;font-weight:600}
input[type=range]{width:100%;accent-color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-weight:500;font-size:15px;transition:all .12s}
.chip.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.no.sel{background:var(--bad);border-color:var(--bad)}
.mealtgl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mealtgl .opt{min-height:96px;padding:12px}
.seg{display:grid;gap:8px}
.seg button{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px}
.seg button.sel{border-color:var(--pri);background:var(--pri-soft)}
.seg button b{display:block}
.seg button small{color:var(--muted)}
.switch{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.switch .k{width:46px;height:26px;border-radius:99px;background:#D9CFC4;position:relative;flex:none;transition:.2s}
.switch .k::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on .k{background:var(--ok)}
.switch.on .k::after{left:23px}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
.txt{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);font:inherit;background:var(--card)}
.txt:focus{outline:2px solid #F4B79F;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}.mealtgl .opt .d{display:none}}
/* loading */
.loading{text-align:center;padding:70px 0}
.pan{font-size:64px;display:inline-block;animation:flip 1s ease-in-out infinite}
@keyframes flip{50%{transform:translateY(-14px) rotate(-12deg)}}
/* results */
.sumbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat .n{font-family:"Bricolage Grotesque";font-size:26px;font-weight:800;line-height:1.1}
.stat .t{font-size:13px;color:var(--muted)}
@media(max-width:600px){.sumbar{grid-template-columns:1fr 1fr}.tabs button{font-size:13px;padding:9px 2px;white-space:nowrap}}
.budgetbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.budgetbar i{display:block;height:100%;border-radius:99px}
.tabs{display:flex;gap:6px;background:#F1E8DD;padding:5px;border-radius:15px;margin:16px 0;position:sticky;top:8px;z-index:5}
.tabs button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px 6px;font-weight:600;font-size:15px;color:#6B5D52}
.tabs button.sel{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.notice{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.notice.warn{background:var(--warn-soft);color:#7A4E0B}
.notice.bad{background:var(--bad-soft);color:#7D241A}
.notice.ok{background:var(--ok-soft);color:#1E6B47}
.day{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.dayh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:#FFFCF8}
.dayh b{font-family:"Bricolage Grotesque";font-size:18px}
.meal{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.thumb{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:30px;flex:none;cursor:pointer}
.meal .info{flex:1;min-width:0;cursor:pointer}
.meal .k{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.meal .nm{font-weight:600;line-height:1.25}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:3px}
.badge.cook{background:var(--pri-soft);color:var(--pri)}
.badge.left{background:#EEF0F7;color:#4A5578}
.badge.daily{background:var(--ok-soft);color:var(--ok)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:16px;flex:none}
.iconbtn.on{background:var(--ink);border-color:var(--ink)}
.shopcat{margin-bottom:14px}
.shopcat h3{font-size:17px;margin:0 0 8px;display:flex;justify-content:space-between}
.item{display:flex;gap:12px;align-items:center;padding:11px 14px;background:var(--card);border-radius:14px;margin-bottom:6px;box-shadow:0 1px 0 rgba(0,0,0,.03);cursor:pointer}
.item .cb{width:24px;height:24px;border-radius:8px;border:2px solid #D3C6B8;flex:none;display:grid;place-items:center;color:#fff;font-size:14px}
.item.done .cb{background:var(--ok);border-color:var(--ok)}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item .nm{font-weight:600}
.item .sub{font-size:13px;color:var(--muted)}
.item .pr{font-weight:700;white-space:nowrap}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rcard{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.rcard:hover{transform:translateY(-3px)}
.rcard .ph{height:120px;display:grid;place-items:center;font-size:58px;position:relative}
.rcard .ph small{position:absolute;bottom:8px;left:10px;background:rgba(255,255,255,.85);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600}
.rcard .bd{padding:12px 14px}
.rcard .bd b{display:block;line-height:1.25}
.rcard .bd span{font-size:13px;color:var(--muted)}
.nutr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nutr div{background:#FBF6EF;border-radius:12px;padding:10px;text-align:center}
.nutr b{display:block;font-family:"Bricolage Grotesque";font-size:20px}
.nutr span{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:99px}
table.nt{width:100%;border-collapse:collapse;font-size:14px}
table.nt th,table.nt td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line)}
table.nt th:first-child,table.nt td:first-child{text-align:left}
table.nt th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
/* modal */
.ov{position:fixed;inset:0;background:rgba(42,33,27,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;animation:up .25s ease-out}
@media(min-width:700px){.ov{align-items:center}.modal{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.mhero{height:170px;display:grid;place-items:center;font-size:84px;position:relative}
.mclose{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:18px}
.mbody{padding:18px 20px 26px}
.mbody h2{font-size:26px;margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.tags span{font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.ingl{list-style:none;padding:0;margin:0}
.ingl li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ingl li b{white-space:nowrap}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:4px 0 14px 42px}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.mh3{font-size:18px;margin:20px 0 10px}
.alt{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--card);margin-bottom:8px;cursor:pointer;border:2px solid transparent}
.alt:hover{border-color:#F4B79F}
.alt.cur{border-color:var(--pri)}
.delta{font-weight:700;font-size:14px;white-space:nowrap}
.delta.up{color:var(--bad)} .delta.down{color:var(--ok)}
.chainpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chainbtn,.cmpbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.chainbtn .dot,.cmpbtn .dot{width:14px;height:14px;border-radius:50%;background:var(--cc);box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.08)}
.chainbtn.sel,.cmpbtn.sel{border-color:var(--ink);background:#FFFCF8}
.chaincmp{padding:14px;margin-bottom:4px}
.cmpgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cmpbtn{padding:10px 4px;gap:3px;font-size:14px;position:relative}
.cmpbtn span{font-weight:700;font-size:15px}
.cmpbtn em{font-style:normal;font-size:11px;color:var(--ok);font-weight:700}
@media(max-width:600px){.cmpgrid,.chainpick{grid-template-columns:1fr 1fr}}
.foot{margin-top:30px;font-size:13px;color:var(--muted);text-align:center}
.search{margin-bottom:12px}
.fadein{animation:fi .3s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
</style>
</head>

const I={}; for(const [id,a] of Object.entries(RAW_I)) I[id]={id,n:a[0],c:a[1],u:a[2],kcal:a[3],b:a[4],s:a[5],t:a[6],tg:(a[7]||'').split(' ').filter(Boolean),pan:!!a[8],pr:a[9]};
function fac(g,c){return g.pr.f&&g.pr.f[c]!=null?g.pr.f[c]:F[c]}
function unitP(id,c){const g=I[id],f=fac(g,c);const o=[];(g.pr.p||[]).forEach(([s,p])=>o.push(p/s));if(g.pr.l)o.push(g.pr.l[1]/1000);if(g.pr.pt&&c!=='L')o.push(g.pr.pt/1000);return Math.min(...o)*f}
const R=RAW_R.map(r=>{const ing=r.i.split(' ').map(x=>{const [k,v]=x.split(':');if(!I[k])console.warn('chyba surovina',k);return [k,+v]});const tg=r.tg.split(' ');const rr={...r,ing,tg,k:r.k||4};rr.nut=nutOf(rr);rr.cost=ing.reduce((s,[k,q])=>s+unitP(k,'L')*q,0);return rr});
const RB=Object.fromEntries(R.map(r=>[r.id,r]));

/* ---------- filtering & scoring ---------- */
function excluded(r){
 const ex=S.excl;
 for(const [k] of r.ing){const t=I[k].tg;if(t.some(x=>ex.includes(x)))return true}
 if(ex.includes('pikant')&&r.tg.includes('pikant'))return true;
 const words=norm(S.exclText||'').split(/[,;\n]+/).map(w=>w.trim()).filter(w=>w.length>=3);
 for(const w of words){if(norm(r.n).includes(w))return true;for(const [k] of r.ing){if(norm(I[k].n).includes(w))return true}}
 return false}
function score(r,m){
 const A=S.ans;let sc=0,mis=0;
 const single=k=>{const v=A[k];if(!v||v==='any')return;if(r.tg.includes(v))sc+=3;else mis++};
 const multi=k=>{const v=A[k]||[];if(!v.length)return;if(v.some(x=>r.tg.includes(x)))sc+=3;else mis++};
 if(m==='b'){single('b_taste');single('b_temp');multi('b_base');
  const f=A.b_fruit;if(A.b_taste!=='slane'){if(f==='ano'){r.tg.includes('ovocie')?sc+=2:mis++}else if(f==='nie'&&r.tg.includes('ovocie'))mis++}
  const lim=+A.b_time||60;if(r.t>lim)mis++;else sc+=1}
 if(m==='l'){multi('l_meat');multi('l_side');single('l_style');const sp=A.l_spicy;if(sp==='nie'&&r.tg.includes('pikant'))mis++;if(sp==='ano'&&r.tg.includes('pikant'))sc+=1}
 if(m==='d'){single('d_weight');single('d_temp');single('d_taste')}
 if(S.goal==='protein')sc+=r.nut.b/10;
 if(S.goal==='light')sc-=r.nut.kcal/250;
 return {sc,mis}}
function candidates(m,relaxed){
 const all=R.filter(r=>r.m.includes(m)&&!excluded(r)).map(r=>({r,...score(r,m)}));
 if(relaxed)return all.map(c=>({...c,w:c.sc-4*c.mis}));
 const strict=all.filter(c=>c.mis===0);
 const need=blockSizes(m).length;
 if(strict.length>=Math.min(need,3)||strict.length>=all.length)return strict.map(c=>({...c,w:c.sc}));
 // doplň najbližšími
 const rest=all.filter(c=>c.mis>0).sort((a,b)=>a.mis-b.mis||b.sc-a.sc).slice(0,Math.max(need,3)-strict.length);
 return [...strict,...rest].map(c=>({...c,w:c.sc-3*c.mis}))}
function maxRep(m){return S.variety==='save'?MEALS[m].max:S.variety==='mid'?2:1}
function blockSizes(m){const Y=S.days,mx=maxRep(m),n=Math.ceil(Y/mx),base=Math.floor(Y/n),rem=Y%n;return Array.from({length:n},(_,i)=>base+(i<rem?1:0))}

/* ---------- nákup: výber balení / kusov / pultu ---------- */
const BUYMEMO=new Map();
function buyRegular(id,q,c){
 const g=I[id],f=fac(g,c),per=PERISH[g.c];let best=null;
 const consider=o=>{o.left=o.amt-q;o.wasteV=o.left>0?o.left*(o.cost/o.amt)*per:0;o.score=o.cost+0.6*o.wasteV;
  if(!best||o.score<best.score-1e-9||(Math.abs(o.score-best.score)<1e-9&&o.left<best.left))best=o};
 if(q<=0)return {mode:'none',amt:0,cost:0,left:0,wasteV:0,score:0};
 const ps=(g.pr.p||[]).slice().sort((a,b)=>b[0]-a[0]);
 if(ps.length){
  const rec=(i,cnt,amt,cost)=>{const [sz,pr]=ps[i];
   if(i===ps.length-1){const n=Math.max(0,Math.ceil((q-amt)/sz-1e-9));const cc=[...cnt,[sz,n]];const A=amt+n*sz;if(A>0&&A>=q-1e-9)consider({mode:'pack',cnt:cc.filter(x=>x[1]>0),amt:A,cost:cost+n*pr*f});return}
   const mx=Math.ceil((q-amt)/sz-1e-9);for(let n=0;n<=Math.max(0,mx);n++)rec(i+1,[...cnt,[sz,n]],amt+n*sz,cost+n*pr*f)};
  rec(0,[],0,0)}
 if(g.pr.l){const [pc,pu]=g.pr.l;const n=Math.max(1,Math.ceil(q/pc-1e-9));consider({mode:'loose',n,amt:n*pc,cost:n*pc/1000*pu*f})}
 if(g.pr.pt&&c!=='L'&&S.pult){const amt=Math.max(100,Math.ceil(q/50)*50);consider({mode:'pult',amt,cost:amt/1000*g.pr.pt*f})}
 return best}
function buy(id,q,c){
 const key=id+'|'+c+'|'+Math.ceil(q)+'|'+(S.pult?1:0);if(BUYMEMO.has(key))return BUYMEMO.get(key);
 const o=buyRegular(id,q,c);BUYMEMO.set(key,o);return o}
function calcCost(plan,c){
 c=c||S.chain;const need={};
 for(const m in plan)for(const bl of plan[m]){const r=RB[bl.rid];for(const [k,q] of r.ing)need[k]=(need[k]||0)+q*S.persons*bl.len}
 let total=0,waste=0;const items=[],pantry=[];
 for(const k in need){const g=I[k],q=need[k];
  if(g.pan&&S.pantry){pantry.push({k,q});continue}
  const o=buy(k,q,c);total+=o.cost;waste+=o.wasteV;items.push({k,q,...o,c:o.cost})}
 return {total,waste,items,pantry}}
function quickCost(plan){return calcCost(plan)}
function sizeTxt(g,s){const u=g.u==='ks'?' ks':g.u==='ml'?' ml':' g';return s>=1000&&g.u!=='ks'?(s/1000+'').replace('.',',')+(g.u==='ml'?' l':' kg'):s+u}
function buyTxt(g,o){
 if(o.mode==='pack')return '📦 '+o.cnt.map(([s,n])=>`${n} × ${sizeTxt(g,s)}`).join(' + ');
 if(o.mode==='loose'){const pn=PCS[g.id]?PCS[g.id][1]:'ks';return `🧺 ${o.n} ${pn} (≈ ${Math.round(o.amt)} g, na váhu)`}
 return `🔪 ${o.amt} g pri pulte`}

/* ---------- optimizer ---------- */
function optimize(relaxed,keep){
 const meals=S.meals.filter(m=>MEALS[m]);
 const C={},struct={};
 for(const m of meals){C[m]=candidates(m,relaxed);let st=0;struct[m]=blockSizes(m).map(len=>{const b={len,start:st};st+=len;return b})}
 let best=null;
 const ITER=2500;
 for(let it=0;it<ITER;it++){
  const used=new Set(),plan={};let pref=0,ok=true;
  for(const m of meals){plan[m]=[];let prev=null;
   if(!C[m].length){ok=false;break}
   struct[m].forEach((b,j)=>{
    const lk=keep&&keep[m]&&keep[m][j]&&keep[m][j].locked?keep[m][j]:null;
    let pick;
    if(lk){pick=C[m].find(c=>c.r.id===lk.rid)||{r:RB[lk.rid],w:0}}
    else{
     let pool=C[m].filter(c=>m!=='l'||c.r.k>=b.len);if(!pool.length)pool=C[m];
     let fresh=pool.filter(c=>!used.has(c.r.id));if(!fresh.length)fresh=pool.filter(c=>c.r.id!==prev);if(!fresh.length)fresh=pool;
     const ws=fresh.map(c=>Math.exp(0.55*c.w));let sum=ws.reduce((a,b)=>a+b,0),x=Math.random()*sum;
     pick=fresh[fresh.length-1];for(let i=0;i<fresh.length;i++){x-=ws[i];if(x<=0){pick=fresh[i];break}}
    }
    used.add(pick.r.id);prev=pick.r.id;pref+=pick.w*b.len;
    plan[m].push({len:b.len,start:b.start,rid:pick.r.id,locked:!!lk});
   });
  }
  if(!ok)break;
  const qc=quickCost(plan),cost=qc.total;
  const obj=cost<=S.budget?pref*1.5-cost*0.4-qc.waste*1.0:-10000-(cost-S.budget)*100+pref*0.01;
  if(!best||obj>best.obj)best={plan,cost,obj,pref};
 }
 return best}

function pickChain(){let best=null;for(const k of Object.keys(CHAINS)){const c=calcCost(V.plan,k);if(!best||c.total<best.c.total)best={k,c}}S.chain=best.k;V.cost=best.c}
function generate(keepLocks){
 S.chain='L';
 V.warn=[];
 const keep=keepLocks&&V.plan?V.plan:null;
 const empty=S.meals.filter(m=>!candidates(m,true).length);
 if(empty.length)V.warn.push(['bad',`Pre ${empty.map(m=>MEALS[m].n.toLowerCase()).join(', ')} nezostal po tvojich vylúčeniach žiadny recept. Skús uvoľniť niektoré obmedzenia.`]);
 const origMeals=S.meals;S.meals=S.meals.filter(m=>!empty.includes(m));
 let res=S.meals.length?optimize(false,keep):null;
 if(res&&res.cost>S.budget){const r2=optimize(true,keep);if(r2&&r2.cost<=S.budget){res=r2;V.warn.push(['warn','Aby sa plán zmestil do rozpočtu, niektoré jedlá úplne nesedia na všetky tvoje odpovede. Môžeš ich vymeniť tlačidlom 🔄.'])}else if(r2&&r2.cost<res.cost)res=r2}
 S.meals=origMeals;
 if(!res){V.plan=null;V.cost=null;return}
 V.plan=res.plan;pickChain();
 if(V.cost.total>S.budget)V.warn.push(['bad',`Za ${eur(S.budget)} sa to nedá – najlacnejší plán, ktorý som našiel, stojí ${eur(V.cost.total)}. Zvýš rozpočet, skráť počet dní alebo v nastaveniach zvoľ „Šetriť“ (viac opakovaní).`]);
}

 <h2 class="qtitle">${q.t}</h2>${q.sub?`<p class="qsub">${q.sub}</p>`:'<p class="qsub"></p>'}
 <div class="opts">${opts.map(([v,e,l,d])=>{const sel=q.type==='multi'?(val||[]).includes(v):val===v;return `<button class="opt ${sel?'sel':''}" data-ans="${v}"><span class="e">${e}</span><span class="l">${l}</span>${d?`<span class="d">${d}</span>`:''}</button>`}).join('')}</div>

function loading(){
 setTimeout(()=>{generate(false);V.screen='result';V.tab='plan';V.checked={};save();render()},900);
 return `<div class="loading fadein"><div class="pan">🍳</div><h2 style="margin-top:14px">Skladám ti jedálniček…</h2><p class="muted">Porovnávam ${R.length} receptov, balenia v obchode a tvoj rozpočet.</p></div>`}

function dayLabel(i){const d=new Date(S.start+'T12:00:00');d.setDate(d.getDate()+i);const n=['Nedeľa','Pondelok','Utorok','Streda','Štvrtok','Piatok','Sobota'][d.getDay()];return {n,dt:d.getDate()+'. '+(d.getMonth()+1)+'.'}}
function dayGen(i){const d=new Date(S.start+'T12:00:00');d.setDate(d.getDate()+i);return ['nedele','pondelka','utorka','stredy','štvrtka','piatka','soboty'][d.getDay()]}
function blockAt(m,day){return (V.plan[m]||[]).findIndex(b=>day>=b.start&&day<b.start+b.len)}
function dayNut(day){const o={kcal:0,b:0,s:0,t:0};for(const m in V.plan){const j=blockAt(m,day);if(j<0)continue;const n=RB[V.plan[m][j].rid].nut;for(const k in o)o[k]+=n[k]}return o}

function result(){
 if(!V.plan)return `<div class="card fadein">${V.warn.map(w=>`<div class="notice ${w[0]}">${w[1]}</div>`).join('')||'<p>Zatiaľ nemáš žiadny plán.</p>'}<button class="btn" data-go="setup">Upraviť zadanie</button></div>`;
 const c=V.cost,over=c.total>S.budget,pct=Math.min(100,c.total/S.budget*100);
 let avg=0;for(let i=0;i<S.days;i++)avg+=dayNut(i).kcal;avg/=S.days;
 const cmp=Object.keys(CHAINS).map(k=>({k,t:calcCost(V.plan,k).total}));const cheapest=cmp.reduce((a,b)=>b.t<a.t?b:a);

 return `<div class="fadein">

  <button class="btn ghost small" data-go="setup">⚙️ Upraviť zadanie</button><button class="btn small" id="regen">🎲 Iný návrh</button></div>
 ${V.warn.map(w=>`<div class="notice ${w[0]}">${w[1]}</div>`).join('')}
 <div class="sumbar">
  <div class="stat"><div class="n" style="color:${over?'var(--bad)':'var(--ok)'}">${eur(c.total)}</div><div class="t">z rozpočtu ${eur(S.budget)}</div><div class="budgetbar"><i style="width:${pct}%;background:${over?'var(--bad)':'var(--ok)'}"></i></div></div>
  <div class="stat"><div class="n">${over?'−'+eur(c.total-S.budget):eur(S.budget-c.total)}</div><div class="t">${over?'chýba':'ostane ti'}</div></div>
  <div class="stat"><div class="n" style="color:${c.waste>1.5?'var(--warn)':'var(--ok)'}">${eur(c.waste)}</div><div class="t">čerstvé zvyšky (${wasteItems.length} pol.)</div></div>
  <div class="stat"><div class="n">${Math.round(avg)}</div><div class="t">kcal denne (z plánu, na osobu)</div></div>
 </div>
 <div class="card chaincmp"><div class="row" style="margin-bottom:8px"><b>Rovnaký nákup v obchodoch</b><span class="spacer"></span><span class="muted" style="font-size:13px">zoznam je pre ${CHAINS[S.chain].n}</span></div>
  <div class="cmpgrid">${cmp.map(x=>`<div class="cmpbtn ${x.k===S.chain?'sel':''}" style="--cc:${CHAINS[x.k].c}"><span class="dot"></span><b>${CHAINS[x.k].n}</b><span>${eur(x.t)}</span>${x.k===cheapest.k?'<em>najlacnejšie</em>':''}</div>`).join('')}</div></div>
 <div class="tabs">${[['plan','📅 Plán'],['shop','🛒 Nákup'],['rec','📖 Recepty'],['nut','💪 Výživa']].map(([k,l])=>`<button class="${V.tab===k?'sel':''}" data-tab="${k}">${l}</button>`).join('')}</div>
 <div id="tabc">${({plan:tabPlan,shop:tabShop,rec:tabRec,nut:tabNut})[V.tab]()}</div>
 <p class="foot">Ceny sú bežné (nie akciové) ceny – Lidl, Kaufland a Tesco podľa štátneho porovnávača cenyslovensko.sk (7/2026) a Tesco online (11/2026); Billa je odhad. Výživové hodnoty sú približné.</p></div>`}

function tabPlan(){

  h+=`<div class="day"><div class="dayh"><div><b>${dl.n}</b> <span class="muted">${dl.dt} · deň ${i+1}</span></div><span class="muted" style="font-size:14px">${Math.round(n.kcal)} kcal · ${Math.round(n.b)} g bielk.</span></div>`;
  for(const m of order){const j=blockAt(m,i);const bl=V.plan[m][j],r=RB[bl.rid],di=i-bl.start;
   let badge;

   else badge=bl.len>1?`<span class="badge daily">${di===0?'🆕 Nové':'🔁 Ako včera'} · ${di+1}/${bl.len}</span>`:'';
   h+=`<div class="meal"><div class="thumb" style="background:${grad(r.id)}" data-rec="${r.id}" data-m="${m}" data-j="${j}">${r.e}</div>

    ${di===0?`<button class="iconbtn ${bl.locked?'on':''}" title="Zamknúť – pri novom návrhu sa nezmení" data-lock="${m}:${j}">${bl.locked?'🔒':'🔓'}</button><button class="iconbtn" title="Vymeniť jedlo" data-swap="${m}:${j}">🔄</button>`:''}</div>`}

function tabRec(){

function tabNut(){
 const RI={kcal:2000,b:50,s:260,t:70};
 let rows='',tot={kcal:0,b:0,s:0,t:0};
 for(let i=0;i<S.days;i++){const n=dayNut(i);for(const k in tot)tot[k]+=n[k];rows+=`<tr><td>${dayLabel(i).n.slice(0,2)} ${dayLabel(i).dt}</td><td>${Math.round(n.kcal)}</td><td>${Math.round(n.b)}</td><td>${Math.round(n.s)}</td><td>${Math.round(n.t)}</td></tr>`}
 const avg={};for(const k in tot)avg[k]=tot[k]/S.days;
 const bar=(k,l,u)=>{const p=avg[k]/RI[k]*100;return `<div style="margin-bottom:12px"><div class="row"><b>${l}</b><span class="spacer"></span><span>${Math.round(avg[k])} ${u} <span class="muted">/ ${RI[k]} ${u} (${Math.round(p)} %)</span></span></div><div class="bar"><i style="width:${Math.min(100,p)}%;background:${p>115?'var(--warn)':'var(--ok)'}"></i></div></div>`};
 const missing=['b','l','d'].filter(m=>!S.meals.includes(m)).map(m=>MEALS[m].n.toLowerCase());
 return `<div class="card" style="margin-bottom:12px"><h3 style="margin-bottom:4px">Priemerný deň (na osobu)</h3><p class="muted" style="margin-top:0;font-size:14px">Porovnanie s referenčným príjmom pre dospelého (EÚ, 2000 kcal).${missing.length?` Plán nepočíta ${missing.join(' a ')} – reálny príjem bude vyšší.`:''}</p>
 ${bar('kcal','Energia','kcal')}${bar('b','Bielkoviny','g')}${bar('s','Sacharidy','g')}${bar('t','Tuky','g')}</div>
 <div class="card"><table class="nt"><thead><tr><th>Deň</th><th>kcal</th><th>Bielk. g</th><th>Sach. g</th><th>Tuky g</th></tr></thead><tbody>${rows}</tbody></table></div>`}

function catalog(){

 return `<div class="fadein"><div class="row" style="margin-bottom:12px"><h2 class="qtitle" style="margin:0">Všetky recepty</h2><span class="spacer"></span><button class="btn ghost small" data-go="${V.plan?'result':'home'}">← Späť</button></div>

 $('#modal').innerHTML=`<div class="ov" id="ov"><div class="modal"><div class="mbody">
  <div class="row"><h2 style="font-size:22px">Vymeniť ${MEALS[m].n.toLowerCase()} (${bl.len} ${bl.len===1?'deň':bl.len<5?'dni':'dní'})</h2><span class="spacer"></span><button class="iconbtn" id="mclose">✕</button></div>
  <p class="muted">Pri každom jedle vidíš, ako sa zmení cena celého nákupu. Najvyššie sú tie, ktoré sedia na tvoje odpovede.</p>
  ${list.map(x=>{const d=x.cost-cur;return `<div class="alt ${x.r.id===bl.rid?'cur':''}" data-pick="${x.r.id}"><div class="thumb" style="background:${grad(x.r.id)};width:46px;height:46px;font-size:24px">${x.r.e}</div><div style="flex:1;min-width:0"><b>${esc(x.r.n)}</b><div class="muted" style="font-size:13px">${x.mis?'⚠️ nesedí na všetky odpovede · ':'✅ sedí na tvoje odpovede · '}${Math.round(x.r.nut.kcal)} kcal</div></div><span class="delta ${d>0.004?'up':d<-0.004?'down':''}">${x.r.id===bl.rid?'aktuálne':Math.abs(d)<0.005?'± 0 €':(d>0?'+':'−')+eur(Math.abs(d))}</span></div>`}).join('')}
 </div></div></div>`;
 $('#mclose').onclick=closeM;$('#ov').onclick=e=>{if(e.target.id==='ov')closeM()};
 document.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{bl.rid=el.dataset.pick;bl.locked=true;pickChain();V.warn=V.warn.filter(w=>w[0]!=='bad'||!w[1].startsWith('Za '));if(V.cost.total>S.budget)V.warn.push(['bad',`Po výmene je nákup ${eur(V.cost.total)} – o ${eur(V.cost.total-S.budget)} nad rozpočtom.`]);closeM();render()});
}

/* ---------- events ---------- */
function bind(){
 const on=(sel,fn)=>document.querySelectorAll(sel).forEach(el=>el.onclick=e=>fn(el,e));
 on('[data-go]',el=>{const g=el.dataset.go;if(g==='result'&&!V.plan)return;V.screen=g;render()});
 if(V.screen==='setup'){
  on('[data-b]',el=>{S.budget=Math.max(10,Math.min(250,S.budget+ +el.dataset.b));save();render()});
  const br=$('#budget');br.oninput=()=>{S.budget=+br.value;$('.big-num .v').textContent=S.budget+' €'};br.onchange=()=>{save();render()};
  on('[data-days]',el=>{S.days=+el.dataset.days;save();render()});
  on('[data-d]',el=>{S.days=Math.max(1,Math.min(14,S.days+ +el.dataset.d));save();render()});
  on('[data-p]',el=>{S.persons=Math.max(1,Math.min(6,S.persons+ +el.dataset.p));save();render()});
  on('[data-meal]',el=>{const k=el.dataset.meal;S.meals=S.meals.includes(k)?S.meals.filter(x=>x!==k):[...S.meals,k].sort((a,b)=>'bld'.indexOf(a)-'bld'.indexOf(b));save();render()});
  on('[data-var]',el=>{S.variety=el.dataset.var;save();render()});
  on('[data-goal]',el=>{S.goal=el.dataset.goal;save();render()});
  on('#pantry',()=>{S.pantry=!S.pantry;save();render()});on('#pult',()=>{S.pult=!S.pult;save();render()});
  $('#start').onchange=e=>{S.start=e.target.value||DEF.start;save()};
 }
 if(V.screen==='excl'){
  on('[data-ex]',el=>{const v=el.dataset.ex;S.excl=S.excl.includes(v)?S.excl.filter(x=>x!==v):[...S.excl,v];el.classList.toggle('sel');save()});
  $('#exclText').oninput=e=>{S.exclText=e.target.value;save()};
  $('#toQ').onclick=()=>{V.qi=0;V.plan=null;V.screen=activeQ().length?'q':'loading';render()};
 }
 if(V.screen==='q'){
  const q=activeQ()[V.qi];
  on('[data-ans]',el=>{const v=el.dataset.ans;
   if(q.type==='multi'){const a=S.ans[q.id]||[];S.ans[q.id]=a.includes(v)?a.filter(x=>x!==v):[...a,v];save();render()}
   else{S.ans[q.id]=v;save();el.classList.add('sel');setTimeout(()=>{V.qi++;render()},220)}});
  $('#qBack').onclick=()=>{if(V.qi>0)V.qi--;else V.screen='excl';render()};
  $('#qNext').onclick=()=>{V.qi++;render()};
 }
 if(V.screen==='result'&&V.plan){
  on('[data-tab]',el=>{V.tab=el.dataset.tab;render()});
  $('#regen').onclick=()=>{generate(true);V.checked={};render()};
  on('[data-rec]',el=>openRecipe(el.dataset.rec,el.dataset.m,+el.dataset.j));
  on('[data-lock]',el=>{const [m,j]=el.dataset.lock.split(':');const b=V.plan[m][+j];b.locked=!b.locked;render()});
  on('[data-swap]',el=>{const [m,j]=el.dataset.swap.split(':');openSwap(m,+j)});
  on('[data-chk]',el=>{const k=el.dataset.chk;V.checked[k]=!V.checked[k];el.classList.toggle('done');el.querySelector('.cb').textContent=V.checked[k]?'✓':''});
  const cl=$('#copyList');if(cl)cl.onclick=async()=>{
   const txt='NÁKUPNÝ ZOZNAM – '+CHAINS[S.chain].n+' ('+eur(V.cost.total)+')\n'+Object.keys(CATS).map(cat=>{const a=V.cost.items.filter(i=>I[i.k].c===cat);return a.length?`\n${CATS[cat][1].toUpperCase()}\n`+a.map(i=>`☐ ${I[i.k].n} – ${buyTxt(I[i.k],i).replace(/^\S+ /,'')} (${eur(i.c)})`).join('\n'):''}).join('');
   try{await navigator.clipboard.writeText(txt);cl.textContent='✅ Skopírované'}catch(e){cl.textContent='Nepodarilo sa skopírovať';}
   setTimeout(()=>{cl.textContent='📋 Kopírovať zoznam'},2000)};
 }
 if(V.screen==='catalog'){
  on('[data-catf]',el=>{V.catF=el.dataset.catf;render()});
  on('[data-rec]',el=>openRecipe(el.dataset.rec));
  const cq=$('#catQ');cq.oninput=()=>{V.catQ=cq.value;const f=V.catF||'all',qq=norm(cq.value);$('#catGrid').innerHTML=catCards(R.filter(r=>(f==='all'||r.m.includes(f))&&(!qq||norm(r.n).includes(qq)||r.ing.some(([k])=>norm(I[k].n).includes(qq)))));on('#catGrid [data-rec]',el=>openRecipe(el.dataset.rec))};
 }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
render();
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&location.hostname.endsWith('github.io'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
</body>
</html>
